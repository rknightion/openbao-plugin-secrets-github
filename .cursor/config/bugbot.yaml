version: 1
triggers:
  drafts: false
  frequency: everyPush
review:
  effort: smart
  smartPrompt: >-
    Use high effort for changes to github/backend.go, github/path.go, github/path_config.go,
    github/path_token*.go, github/path_permission_set.go, github/client.go,
    github/revocation.go, go.mod, Containerfile, or .github/workflows/, or changes to
    authentication, token scope, lease handling, credential storage, or release integrity.
    Use low effort for documentation, backlog or tracker-only changes that
    preserve executable policy. Use default effort otherwise.
  incremental: true
prSummary:
  mode: comment
autofix:
  mode: disabled
