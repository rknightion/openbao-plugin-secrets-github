name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `edited` re-runs CI when the pull request body changes, so the acceptance evidence check reads
    # the new table. Every job runs on it: a job skipped by `if:` would report success to ci-success.
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      # govulncheck must run inside THIS job's setup-go environment, not
      # golang/govulncheck-action -- that action always passes go-version:
      # stable alongside go-version-file, and setup-go ignores go-version-file
      # whenever go-version is set, so it would scan with the newest Go rather
      # than the toolchain this module actually pins. Every release ships
      # whatever stdlib the `go` directive selects, so scanning with a
      # different toolchain would report a clean bill of health for a binary
      # that isn't clean.
      - run: just setup
      - run: just check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: just image

  # A pull request that closes an issue shows evidence for each of its acceptance criteria. Checks
  # only pull requests with a closing keyword (enforce-all-prs: false), because this repository takes
  # outside and bot pull requests. Check run: `ac-evidence / Acceptance evidence`.
  ac-evidence:
    # The reusable fails on any event but pull_request; on a push to main this job is skipped.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: rknightion/.github/.github/workflows/ac-evidence.yml@8f00b7fb896191e598f12ed565395697c539add1 # v1.26.9

  # The lines a pull request adds carry no identifier, email address, public address or credential
  # shape. The reusable fails on any event but pull_request, so it runs on pull requests only.
  # Check run: `privacy-sweep / Privacy sweep`.
  privacy-sweep:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/privacy-sweep.yml@8f00b7fb896191e598f12ed565395697c539add1 # v1.26.9

  # The Backlog.md board is retired: issues are the queue. A pull request may delete files under
  # backlog/ or move them out, never add or change one there. Reads the file list from the API, so
  # no pull request code is checked out.
  backlog-freeze:
    name: backlog/ is frozen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Refuse additions and changes under backlog/
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$CHANGED_FILES" =~ ^[0-9]+$ ]]; then
            echo "::error title=backlog freeze::the pull request number or file count is malformed"
            exit 1
          fi
          # The pull request files API lists at most 3000 files; refuse rather than check part of a change.
          if (( CHANGED_FILES > 3000 )); then
            echo "::error title=backlog freeze::${CHANGED_FILES} changed files is more than the API lists; split the pull request"
            exit 1
          fi
          offending="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | select(.status != "removed") | select(.filename | startswith("backlog/")) | "\(.status) \(.filename | @json)"')"
          if [[ -n "$offending" ]]; then
            echo "::error title=backlog freeze::this pull request adds or changes files under backlog/; the board is retired, so file the work as an issue"
            printf '  %s\n' "$offending"
            exit 1
          fi
          echo "No file under backlog/ is added or changed."

  # zizmor fails a pull request on any finding (enforce); push runs upload SARIF instead.
  zizmor:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: rknightion/.github/.github/workflows/zizmor.yml@e5b9f15bc8ccafdbad75e623bbd0dbb27127f049 # v1.28.0
    with:
      enforce: true

  ci-success:
    if: always()
    needs: [test, image, ac-evidence, privacy-sweep, backlog-freeze, zizmor]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if printf '%s' "$NEEDS" | grep -q '"result": *"failure"\|"result": *"cancelled"'; then
            echo "::error::a required job failed"
            exit 1
          fi
          echo "all jobs passed"
      # A skipped job reports success, so on a pull request the pull request checks must have
      # actually run and passed.
      - name: Fail if a pull request check did not run
        if: ${{ github.event_name == 'pull_request' }}
        env:
          AC_EVIDENCE: ${{ needs.ac-evidence.result }}
          PRIVACY_SWEEP: ${{ needs.privacy-sweep.result }}
          BACKLOG_FREEZE: ${{ needs.backlog-freeze.result }}
          ZIZMOR: ${{ needs.zizmor.result }}
        run: |
          if [[ "$AC_EVIDENCE" != "success" || "$PRIVACY_SWEEP" != "success" || "$BACKLOG_FREEZE" != "success" || "$ZIZMOR" != "success" ]]; then
            echo "ac-evidence: ${AC_EVIDENCE}, privacy-sweep: ${PRIVACY_SWEEP}, backlog-freeze: ${BACKLOG_FREEZE}, zizmor: ${ZIZMOR}; all must pass on a pull request"
            exit 1
          fi
