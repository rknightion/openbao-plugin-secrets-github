name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '27 3 * * 2'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@8ea95233ce0b1b2880124f745238e8d194524365 # v1.32.1
    with:
      languages: '[{"language":"go","build-mode":"autobuild"},{"language":"actions","build-mode":"none"}]'
      timeout-minutes: 30
