name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '27 3 * * 2'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@0228d8b9f1e36ff3a1d0906574d70fa174ddc7bf # v1.5.1
    with:
      languages: '[{"language":"go","build-mode":"autobuild"},{"language":"actions","build-mode":"none"}]'
