name: Broker connectivity probe

# End-to-end proof of the path issue #23 depends on:
#
#   GitHub OIDC -> Tailscale workload identity federation -> ephemeral tag:gha
#   node -> OpenBao auth/gha JWT role -> permission set -> scoped ghs_ token.
#
# No durable secret lives in this repo. TS_WIF_CLIENT_ID and TS_WIF_AUDIENCE
# are identifiers, not credentials: possession of either grants nothing without
# a GitHub-signed OIDC token whose claims match the federated identity
# (repository_owner_id 12484127, ref refs/heads/main).
#
# Manual-dispatch only, and worth keeping after the rollout: when a broker
# workflow starts failing, this separates "tailnet/ACL broke" from "OpenBao
# auth broke" from "the token is scoped wrong", which are indistinguishable
# from a failed release job.
#
# Every assertion here is paired with its negative. A tailnet join that
# silently does nothing would still let a naive positive-only check pass.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: broker-connectivity-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # mint the GitHub OIDC token exchanged with Tailscale
    steps:
      - name: Show the OIDC claims the exchange will be matched on
        # Tailscale's token exchange answers a claim mismatch with a bare 403
        # and deliberately does not say WHICH claim failed, so without this the
        # only way to debug a refused exchange is to guess and re-run. Prints
        # iss/sub/aud only -- never the token, and never the signature.
        #
        # Worth knowing: GitHub now emits IMMUTABLE subject claims
        # (repo:owner@<id>/repo@<id>:...) on repos created after 2026-07-15,
        # while workflow_ref and repository stay plain names. A trust policy
        # written against the classic sub format fails on a new repo.
        env:
          TS_WIF_AUDIENCE: ${{ secrets.TS_WIF_AUDIENCE }}
        run: |
          set -euo pipefail
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${TS_WIF_AUDIENCE}" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          python3 - "$tok" <<'PY'
          import base64, json, sys
          p = sys.argv[1].split('.')[1]
          c = json.loads(base64.urlsafe_b64decode(p + '=' * (-len(p) % 4)))
          for k in sorted(c):
              print(f"{k} = {c[k]!r}")
          PY

      # This joins the tailnet as well as minting, so everything below it
      # depends on this step having succeeded.
      - name: Mint a scoped installation token through the broker
        id: tok
        uses: rknightion/.github/.github/actions/broker-token@b9ab5f80961f2c29c47a8d7d5dff112b6551169c
        with:
          permission-set: release-please-openbao-plugin-secrets-github
          tailscale-client-id: ${{ secrets.TS_WIF_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_WIF_AUDIENCE }}

      - name: OpenBao is reachable, and is unsealed
        # sys/health is unauthenticated, so this isolates network reach and TLS
        # from anything credential-related. `sealed: false` is checked
        # deliberately: a sealed OpenBao answers this endpoint perfectly well
        # but cannot mint anything, and that is the failure mode most likely to
        # be misread as a broker bug.
        run: |
          set -euo pipefail
          body=$(curl -sS --max-time 15 https://openbao.saga-turtle.ts.net/v1/sys/health)
          echo "$body"
          echo "$body" | grep -q '"initialized":true' || { echo "::error::not initialized"; exit 1; }
          echo "$body" | grep -q '"sealed":false'     || { echo "::error::OpenBao is SEALED -- no token can be minted until it unseals"; exit 1; }
          echo "reachable, initialized, unsealed"

      - name: Public DNS still resolves after joining the tailnet
        # Regression guard for a real failure (run 31250275443). Accepting
        # tailnet DNS points the runner at 10.0.0.254, which tag:gha may not
        # reach, so every public name stops resolving the moment it joins --
        # including api.github.com, which is what the token is FOR. The action
        # passes --accept-dns=false to prevent that; this proves it held.
        run: |
          set -euo pipefail
          curl -sS -o /dev/null --max-time 10 https://api.github.com/zen \
            || { echo "::error::api.github.com unresolvable after tailnet join -- --accept-dns=false regressed"; exit 1; }
          echo "api.github.com still reachable"

      - name: The minted token works, and only where it should
        # Positive: authenticates to GitHub as the App installation.
        # Negative: cannot reach a repo outside its permission set. That second
        # assertion is the property that makes this safe to hand to 18 repos --
        # without it, a scoping bug would look exactly like success.
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/rknightion/openbao-plugin-secrets-github)
          [ "$code" = "200" ] || { echo "::error::own repo returned $code, expected 200"; exit 1; }
          echo "own repo: 200"

          other=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/rknightion/meraki-dashboard-exporter)
          if [ "$other" = "200" ]; then
            echo "::error::token reached a repo outside its permission set -- scoping is broken"
            exit 1
          fi
          echo "out-of-scope repo correctly refused (HTTP $other)"

      - name: The ACL grant really is OpenBao-only
        # camden itself (10.0.0.5) is the meaningful negative: OpenBao runs on
        # that host, and the entire reason it has its own tailnet identity is
        # so CI is granted OpenBao alone rather than everything camden fronts.
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 https://10.0.0.5/ || true)
          if [ "$code" != "000" ]; then
            echo "::error::reached camden:443 (HTTP $code) -- tag:gha egress is wider than the ACL intends"
            exit 1
          fi
          echo "camden:443 correctly unreachable from tag:gha"
