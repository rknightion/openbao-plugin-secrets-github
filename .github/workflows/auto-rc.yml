# Automatic release candidates. On every push to main that passes CI, cut
# vX.Y.Z-rc.N against the version release-please is already staging in its open
# release PR, then publish the image for it.
#
# The stable release path (release-please.yml) is untouched: it still opens and
# maintains the release PR, and a stable release still requires an explicit
# merge. The RC path never writes to the changelog or the release PR.
name: auto-rc

# Fires off CI's completion rather than the push itself. The old `push:` trigger
# started this workflow immediately and then burned a runner slot in
# `rc / wait-for-ci` polling for a CI run still queued behind it — 20.6
# runner-hours of pure polling fleet-wide, and 5 of 17 in-flight jobs at one
# sample. workflow_run fires only once CI has a verdict.
#
# `workflows:` matches the workflow's `name:` field, NOT its filename. If that
# name changes this silently stops firing and RCs stop being cut, with no error.
#
# zizmor flags every workflow_run trigger. This one is safe because the `rc` job
# below only runs for a successful CI run that was a push to this repository,
# never a pull request, so the only code it tags and builds is code already
# pushed to main.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] gated on push events from this repo, see the rc job
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # Never cancel a half-published RC; serialize instead.
  group: auto-rc
  cancel-in-progress: false

jobs:
  rc:
    # workflow_run fires for FAILED and cancelled runs too, so the conclusion
    # check is what actually gates the RC on green CI.
    #
    # `branches: [main]` above matches the triggering run's head branch NAME,
    # so a fork pull request from a branch called `main` also matches it, and
    # CI runs on pull requests. Without the event and repository checks a green
    # fork PR would be tagged and published as an RC with write access.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write      # create the RC tag and the GitHub prerelease
      pull-requests: read  # find the open release-please PR
      checks: read         # poll ci-success for this commit
    uses: rknightion/.github/.github/workflows/auto-rc.yml@3aee36ed9f327d9238e387c7af7da9ec5369a263 # v1.25.31
    with:
      # Under workflow_run, github.sha is the DEFAULT BRANCH HEAD, not the
      # commit CI ran on — it races ahead on rapid pushes. head_sha is the
      # commit the triggering run actually tested.
      sha: ${{ github.event.workflow_run.head_sha }}
      image-ref: ghcr.io/rknightion/openbao-plugin-secrets-github

  # Same image path a stable release takes, just with an RC tag. publish.yml's
  # own job here only pushes the image via docker/build-push-action (no cosign,
  # no attestations, no Trivy scan), so it needs no more than contents/packages
  # write -- matching exactly what publish.yml's own `publish` job declares.
  publish:
    needs: rc
    if: needs.rc.outputs.tag != ''
    permissions:
      contents: write # attach binaries + checksums to the RC release
      packages: write # push the image to GHCR
    # `./` here, not the newer `$/` self-repository form zizmor prefers:
    # actionlint (pinned in the shared reusable) does not parse `$/` yet. For a
    # job-level reusable workflow call `./` already resolves at the caller's own
    # commit, so nothing is lost. Switch once actionlint accepts `$/`.
    uses: ./.github/workflows/publish.yml # zizmor: ignore[self-repository]
    with:
      release_tag: ${{ needs.rc.outputs.tag }}
