name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Resolve tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w" \
              -o "dist/openbao-plugin-secrets-github_linux_${arch}" .
          done

      - name: Generate checksums
        run: |
          cd dist && sha256sum openbao-plugin-secrets-github_* > checksums.txt
          cat checksums.txt

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/rknightion/openbao-plugin-secrets-github:${{ steps.tag.outputs.tag }}

      - name: Attach binaries and checksums to the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # The ephemeral GITHUB_TOKEN app identity gets "Resource not
          # accessible by integration" updating an already-published
          # release even with contents:write -- same class of restriction
          # release-please-pat works around. Reuse that PAT here.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/openbao-plugin-secrets-github_linux_amd64
            dist/openbao-plugin-secrets-github_linux_arm64
            dist/checksums.txt
