name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Resolve tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Resolve build metadata
        id: meta
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        # -X injections replace what .goreleaser.yml used to provide before
        # it was deleted as dead config -- without projectName, client.go
        # sends every GitHub API request with an empty User-Agent, which
        # GitHub's WAF rejects outright (403, live-reproduced against
        # camden's plugin). projectDocs/projectVersion feed the plugin's
        # own /info path; the prometheus/common/version vars are read by
        # path_info.go for the same endpoint.
        #
        # Deliberately NOT injecting version.BuildDate or version.BuildUser
        # (upstream's goreleaser set both). OpenBao pins an immutable
        # sha256 of this binary while the image tag is mutable, so the
        # build must be reproducible -- a timestamp or a username makes
        # every rebuild of the same tag hash differently and would
        # silently break a running OpenBao on any re-run. Every value
        # injected below is constant for a given tag/commit.
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          BUILD_VERSION: ${{ steps.meta.outputs.version }}
          BUILD_COMMIT: ${{ steps.meta.outputs.commit }}
          MODULE_PATH: github.com/rknightion/openbao-plugin-secrets-github
        run: |
          mkdir -p dist
          LDFLAGS="-s -w"
          LDFLAGS="$LDFLAGS -X ${MODULE_PATH}/github.projectName=openbao-plugin-secrets-github"
          LDFLAGS="$LDFLAGS -X ${MODULE_PATH}/github.projectDocs=https://${MODULE_PATH}"
          LDFLAGS="$LDFLAGS -X ${MODULE_PATH}/github.projectVersion=${RELEASE_TAG}"
          LDFLAGS="$LDFLAGS -X github.com/prometheus/common/version.Version=${BUILD_VERSION}"
          LDFLAGS="$LDFLAGS -X github.com/prometheus/common/version.Revision=${BUILD_COMMIT}"
          LDFLAGS="$LDFLAGS -X github.com/prometheus/common/version.Branch=main"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "$LDFLAGS" \
              -o "dist/openbao-plugin-secrets-github_linux_${arch}" .
          done

      - name: Generate checksums
        run: |
          cd dist && sha256sum openbao-plugin-secrets-github_* > checksums.txt
          cat checksums.txt

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/rknightion/openbao-plugin-secrets-github:${{ steps.tag.outputs.tag }}

      - name: Attach binaries and checksums to the release
        # softprops/action-gh-release re-PATCHes the whole release object
        # (tag_name/target_commitish/name/body/draft/...) to attach assets,
        # and that specific call gets "Resource not accessible by
        # integration/personal access token" against an already-published
        # release under BOTH the ephemeral GITHUB_TOKEN and the
        # RELEASE_PLEASE_TOKEN PAT (verified directly: the same PAT's
        # asset-only `gh release upload` succeeds with no error against
        # this exact release, so it isn't a scope problem -- it's specific
        # to the full-release-update path). Use the asset-only upload
        # endpoint instead, which sidesteps that call entirely.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/openbao-plugin-secrets-github_linux_amd64 \
            dist/openbao-plugin-secrets-github_linux_arm64 \
            dist/checksums.txt \
            --repo "${{ github.repository }}" \
            --clobber
