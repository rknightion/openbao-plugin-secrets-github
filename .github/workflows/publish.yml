name: Publish

on:
  release:
    types: [published]
  # Callable so auto-rc.yml can publish a release candidate in the same run that
  # creates it. The `release: published` path above cannot serve that: auto-rc
  # creates the prerelease with GITHUB_TOKEN, and a GITHUB_TOKEN-created release
  # deliberately does not trigger other workflows. Same `tag` input name as the
  # dispatch path, so `inputs.release_tag` below resolves for both.
  workflow_call:
    inputs:
      release_tag:
        description: "Existing tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Resolve tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          # RELEASE_TAG is interpolated into a multi-line `tags: |` block
          # further down. A dispatch input containing a newline could append
          # an arbitrary extra image tag, so reject anything that isn't a
          # single line matching a version tag.
          if [[ "$(printf '%s' "$RELEASE_TAG" | wc -l)" -ne 0 ]] || ! [[ "$RELEASE_TAG" =~ ^v[0-9] ]]; then
            echo "::error::resolved tag '$RELEASE_TAG' is not a single line matching ^v[0-9] -- refusing to build/push" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Resolve build metadata
        id: meta
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        # -X injections replace what .goreleaser.yml used to provide before
        # it was deleted as dead config -- without projectName, client.go
        # sends every GitHub API request with an empty User-Agent, which
        # GitHub's WAF rejects outright (403, live-reproduced against
        # camden's plugin). projectDocs/projectVersion feed the plugin's
        # own /info path; the prometheus/common/version vars are read by
        # path_info.go for the same endpoint.
        #
        # Deliberately NOT injecting version.BuildDate or version.BuildUser
        # (upstream's goreleaser set both). OpenBao pins an immutable
        # sha256 of this binary while the image tag is mutable, so the
        # build must be reproducible -- a timestamp or a username makes
        # every rebuild of the same tag hash differently and would
        # silently break a running OpenBao on any re-run. Every value
        # injected below is constant for a given tag/commit.
        #
        # -buildvcs=false: `go build` defaults to -buildvcs=auto, which
        # stamps the current commit SHA into the binary. That makes the
        # hash a function of commit + build inputs, not source alone --
        # building the same tag from a moving ref (or re-running publish
        # after main has advanced) can silently produce a different
        # commit and therefore a different hash. Disabling vcs stamping
        # makes the artifact a pure function of source, matching the
        # reproducibility this stanza already relies on. Given a fixed
        # commit and Go version the build is fully reproducible either
        # way -- confirmed byte-identical for v0.1.0 and v0.1.1, both
        # arches, on independent rebuilds. This flag changes the hash for
        # the next release versus prior ones; that's expected, one-time.
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          BUILD_VERSION: ${{ steps.meta.outputs.version }}
          BUILD_COMMIT: ${{ steps.meta.outputs.commit }}
          MODULE_PATH: github.com/rknightion/openbao-plugin-secrets-github
        run: |
          mkdir -p dist
          LDFLAGS="-s -w"
          LDFLAGS="$LDFLAGS -X ${MODULE_PATH}/github.projectName=openbao-plugin-secrets-github"
          LDFLAGS="$LDFLAGS -X ${MODULE_PATH}/github.projectDocs=https://${MODULE_PATH}"
          LDFLAGS="$LDFLAGS -X ${MODULE_PATH}/github.projectVersion=${RELEASE_TAG}"
          LDFLAGS="$LDFLAGS -X github.com/prometheus/common/version.Version=${BUILD_VERSION}"
          LDFLAGS="$LDFLAGS -X github.com/prometheus/common/version.Revision=${BUILD_COMMIT}"
          LDFLAGS="$LDFLAGS -X github.com/prometheus/common/version.Branch=main"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build \
              -trimpath \
              -buildvcs=false \
              -ldflags "$LDFLAGS" \
              -o "dist/openbao-plugin-secrets-github_linux_${arch}" .
          done

      - name: Verify projectName ldflag resolved
        # go build -X on a symbol path that doesn't resolve is silently
        # ignored (exit 0, no warning) -- this module's path has already
        # been renamed once. If it breaks again, projectName is empty and
        # every GitHub call goes out with an empty User-Agent, which
        # GitHub's WAF 403s (this is exactly how v0.1.0 broke). Catch it
        # here, in CI, instead of on a production secrets store.
        run: |
          strings dist/openbao-plugin-secrets-github_linux_amd64 \
            | grep -F -x -q 'openbao-plugin-secrets-github' \
            || { echo "::error::projectName ldflag did not resolve -- the binary would send an empty User-Agent"; exit 1; }

      - name: Generate checksums
        run: |
          cd dist && sha256sum openbao-plugin-secrets-github_* > checksums.txt
          cat checksums.txt

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/rknightion/openbao-plugin-secrets-github:${{ steps.tag.outputs.tag }}

      - name: Verify pushed image matches checksums.txt
        # The Containerfile just COPYs dist/..._linux_${arch} into the
        # image -- it does not rebuild. So the pushed image's binary
        # should be byte-identical to what's in dist/checksums.txt. This
        # is the check that would have caught the v0.1.0 problem in CI:
        # that release's image and its checksums.txt came from two
        # different runs and silently diverged. Pull the just-pushed
        # linux/amd64 image, extract the binary, and compare its hash
        # against the checksums.txt about to be uploaded.
        env:
          IMAGE: ghcr.io/rknightion/openbao-plugin-secrets-github:${{ steps.tag.outputs.tag }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE"
          cid=$(docker create --platform linux/amd64 "$IMAGE")
          docker cp "$cid:/openbao-plugin-secrets-github" ./image-binary-amd64
          docker rm "$cid" >/dev/null
          actual=$(sha256sum ./image-binary-amd64 | awk '{print $1}')
          expected=$(grep 'linux_amd64' dist/checksums.txt | awk '{print $1}')
          if [ -z "$expected" ]; then
            echo "::error::no linux_amd64 line found in dist/checksums.txt"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::pushed image amd64 binary sha256 ($actual) does not match checksums.txt ($expected)"
            exit 1
          fi
          echo "verified: image amd64 binary matches checksums.txt ($actual)"

      - name: Attach binaries and checksums to the release
        # softprops/action-gh-release re-PATCHes the whole release object
        # (tag_name/target_commitish/name/body/draft/...) to attach assets,
        # and that specific call gets "Resource not accessible by
        # integration/personal access token" against an already-published
        # release under BOTH the ephemeral GITHUB_TOKEN and the
        # RELEASE_PLEASE_TOKEN PAT (verified directly: the same PAT's
        # asset-only `gh release upload` succeeds with no error against
        # this exact release, so it isn't a scope problem -- it's specific
        # to the full-release-update path). Use the asset-only upload
        # endpoint instead, which sidesteps that call entirely.
        #
        # This uses the ephemeral GITHUB_TOKEN, not RELEASE_PLEASE_TOKEN.
        # The failure above was never evidence that GITHUB_TOKEN cannot do an
        # asset-only upload -- it failed under both tokens, on a different
        # endpoint. This job already grants `contents: write`, which is what
        # the asset upload endpoint requires, while RELEASE_PLEASE_TOKEN is a
        # PAT scoped across every rknightion repo and widens blast radius on a
        # leak for no gain here. If this step ever does fail, it is cosmetic
        # rather than release-breaking: the image is pushed and hash-verified
        # by the step above, and camden pins the sha256 of the image layer,
        # not of these release assets.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/openbao-plugin-secrets-github_linux_amd64 \
            dist/openbao-plugin-secrets-github_linux_arm64 \
            dist/checksums.txt \
            --repo "${{ github.repository }}" \
            --clobber
